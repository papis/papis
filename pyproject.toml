[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.10.0"]

[project]
name = "papis"
version = "0.16.1"
description = "Powerful and highly extensible command-line based document and bibliography manager"
readme = "README.rst"
keywords = [
    "biblatex",
    "bibtex",
    "biliography",
    "books",
    "cli",
    "command-line",
    "crossref",
    "datasheets",
    "document",
    "elsevier",
    "ieee",
    "latex",
    "libgen",
    "mathematics",
    "mendeley",
    "papers",
    "physics",
    "pubmed",
    "reference manager",
    "research",
    "science",
    "scihub",
    "tui",
    "zotero",
]
license = { text = "GPL-3.0-or-later" }
maintainers = [{ name = "Alejandro Gallo", email = "aamsgallo@gmail.com" }]
authors = [{ name = "Alejandro Gallo", email = "aamsgallo@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft",
    "Operating System :: OS Independent",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML>=3.12",
    "arxiv>=1.0.0",
    "beautifulsoup4>=4.4.1",
    "bibtexparser>=0.6.2",
    "click>=7",
    "colorama>=0.2",
    "dominate>=2.8",
    "filetype>=1.0.1",
    "habanero>=0.6",
    "lark>=1.2.0",
    "lxml>=4.3.5",
    "platformdirs>=4.0.0",
    "prompt_toolkit>=3.0.5",
    "pygments>=2.2",
    "pylatexenc>=2.0",
    "python-doi>=0.1.1",
    "python-slugify>=1.2.6",
    "requests>=2.11.1",
]

[project.urls]
Documentation = "https://papis.readthedocs.io"
Repository = "https://github.com/papis/papis"

[project.optional-dependencies]
# Dev environment -- install if you're working on papis
develop = ["papis[lint,typing,test]"]
# Style enforcement
lint = [
    "ruff",
    "sphinx-lint",
]
# Test suite
test = [
    "pytest",
    "pytest-cov",
]
# Type-checking
typing = [
    "mypy>=1.0",
    "types-beautifulsoup4",
    "types-Pygments",
    "types-docutils",
    "types-PyYAML",
    "types-requests",
]
# To generate documentation
docs = [
    "pytest",
    "sphinx>=4",
    "sphinx_click",
    "sphinx_design",
    "sphinx_rtd_theme>=1",
]
# Libraries that papis knows how to interact with if installed
optional = [
    "Jinja2>=3.0.0",
    "Whoosh>=2.7.4",
    "chardet>=3.0.2",
    "citeproc-py>=0.6",
    "markdownify>=1.0.0",
]
# Custom Sphinx directives for Papis docs
"papis.sphinx_ext" = [
    "docutils",
    "sphinx",
    "sphinx_click",
]
# Pytest fixtures and helpers for testing Papis and plugins
"papis.testing" = [
    "pytest"
]
# Needed when creating Windows installer
windows = [
    "pyinstaller"
]

[project.scripts]
papis = "papis.commands.default:run"

[project.entry-points.pytest11]
papis_testing = "papis.testing"

[project.entry-points."papis.command"]
add = "papis.commands.add:cli"
addto = "papis.commands.addto:cli"
bibtex = "papis.commands.bibtex:cli"
browse = "papis.commands.browse:cli"
cache = "papis.commands.cache:cli"
citations = "papis.commands.citations:cli"
config = "papis.commands.config:cli"
doctor = "papis.commands.doctor:cli"
edit = "papis.commands.edit:cli"
exec = "papis.commands.exec:cli"
explore = "papis.commands.explore:cli"
export = "papis.commands.export:cli"
git = "papis.commands.git:cli"
init = "papis.commands.init:cli"
list = "papis.commands.list:cli"
merge = "papis.commands.merge:cli"
mv = "papis.commands.mv:cli"
open = "papis.commands.open:cli"
rm = "papis.commands.rm:cli"
run = "papis.commands.run:cli"
serve = "papis.commands.serve:cli"
tag = "papis.commands.tag:cli"
update = "papis.commands.update:cli"

[project.entry-points."papis.exporter"]
bibtex = "papis.exporters.bibtex:exporter"
csl = "papis.exporters.csl:exporter"
csv = "papis.exporters.csv:exporter"
json = "papis.exporters.json:exporter"
typst = "papis.exporters.typst:exporter"
yaml = "papis.exporters.yaml:exporter"

[project.entry-points."papis.format"]
jinja2 = "papis.format.jinja:Jinja2Formatter"
python = "papis.format.python:PythonFormatter"

[project.entry-points."papis.source"]
arxiv = "papis.sources.handlers.arxiv:ArxivHandler"
crossref = "papis.sources.handlers.crossref:CrossrefHandler"
dblp = "papis.sources.handlers.dblp:DblpHandler"
doi = "papis.sources.handlers.doi:DoiHandler"
isbn = "papis.sources.handlers.isbn:IsbnHandler"
pmid = "papis.sources.handlers.pmid:PmidHandler"
zenodo = "papis.sources.handlers.zenodo:ZenodoHandler"
# formats
bibtex = "papis.sources.handlers.formats.bibtex:BibTeXHandler"
json = "papis.sources.handlers.formats.json:JsonHandler"
yaml = "papis.sources.handlers.formats.yaml:YamlHandler"
# web
acl = "papis.sources.handlers.web.acl:ACLHandler"
acm = "papis.sources.handlers.web.acm:ACMHandler"
acs = "papis.sources.handlers.web.acs:ACSHandler"
annualreviews = "papis.sources.handlers.web.annualreviews:AnnualReviewsHandler"
aps = "papis.sources.handlers.web.aps:APSHandler"
fallback = "papis.sources.handlers.web:FallbackHandler"
frontiersin = "papis.sources.handlers.web.frontiersin:FrontiersInHandler"
hal = "papis.sources.handlers.web.hal:HALHandler"
ieee = "papis.sources.handlers.ieee:IEEEHandler"
iopscience = "papis.sources.handlers.web.iopscience:IOPscienceHandler"
lingbuzz = "papis.sources.handlers.web.lingbuzz:LingbuzzHandler"
nber = "papis.sources.handlers.web.nber:NberHandler"
projecteuclid = "papis.sources.handlers.web.projecteuclid:ProjectEuclidHandler"
sciencedirect = "papis.sources.handlers.web.sciencedirect:ScienceDirectHandler"
aip = "papis.sources.handlers.web.aip:AIPHandler"
springer = "papis.sources.handlers.web.springer:SpringerHandler"
taylorandfrancis = "papis.sources.handlers.web.taylorandfrancis:TaylorAndFrancisHandler"
thesesfr = "papis.sources.handlers.web.thesesfr:ThesesFrHandler"
usenix = "papis.sources.handlers.web.usenix:USENIXHandler"
worldscientific = "papis.sources.handlers.web.worldscientific:WorldScientificHandler"

[project.entry-points."papis.picker"]
fzf = "papis.pick.fzf:FzfPicker"
papis = "papis.pick.prompt_toolkit:PromptToolkitPicker"
prompt_toolkit = "papis.pick.prompt_toolkit:PromptToolkitPicker"

[tool.hatch.build.targets.sdist]
exclude = [".github", "docs/build"]

[tool.hatch.build.targets.wheel]
packages = ["papis"]

[tool.hatch.build.targets.wheel.shared-data]
"contrib/papis.desktop" = "share/applications/papis.desktop"
"doc/build/man" = "share/man/man1"
"contrib/shell_completion/click/bash/papis.bash" = "share/bash-completion/completions/papis.bash"
"contrib/shell_completion/click/fish/papis.fish" = "share/fish/vendor_completions.d/papis.fish"
"contrib/shell_completion/click/zsh/_papis" = "share/zsh/site-functions/_papis"

[tool.pytest.ini_options]
addopts = [
    "--papis-tmp-doctests",
    "--papis-tmp-xdg-home",
    "--doctest-modules",
    "--cov=papis",
]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
testpaths = [ "papis", "tests" ]
norecursedirs = [".git", "doc", "build", "dist"]
python_files = "*.py"
markers = [
    "config_setup: setup for tmp_config",
    "library_setup: setup for tmp_library",
    "resource_setup: setup for resource_cache",
]

[tool.ruff]
preview = true
line-length = 88

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle
    "F",   # pyflakes
    "G",   # flake8-logging-format
    "I",   # flake8-isort
    "N",   # pep8-naming
    "PGH", # pygrep-hooks
    "PL",  # pylint
    "Q",   # flake8-quotes
    "RUF", # ruff
    "TC",  # flake8-type-checking
    "UP",  # pyupgrade
    "W",   # pycodestyle
]
ignore = [
    # https://docs.astral.sh/ruff/rules/#rules
    "collapsible-else-if",
    "compare-to-empty-string",
    "error-suffix-on-exception-name",
    "global-statement",
    "import-outside-top-level",
    "magic-value-comparison",
    "non-empty-init-module",
    "too-many-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
    "too-many-statements-in-try-clause",
]
task-tags = ["spell"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true
files = [ "papis", "tests", "examples", "tools" ]
warn_unused_ignores = false
show_column_numbers = true
hide_error_codes = false

[[tool.mypy.overrides]]
module = [
    "arxiv.*",
    "citeproc.*",
    "bibtexparser.*",
    "colorama.*",
    "dominate.*",
    "filetype.*",
    "habanero.*",
    "pylatexenc.*",
    "sphinx_click.*",
    "whoosh.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# NOTE: sphinx > 9.0.0 requires Python >= 3.12 for type checking, so we ignore it
module = ["sphinx.*"]
follow_imports = "skip"

[tool.typos.default]
extend-ignore-re = [
    "(?Rm)^.*#\\s*spell:\\s*disable$"
]

[tool.typos.files]
extend-exclude = [
    "examples/scripts/LTWA.json",
    "tests/data",
    "tests/sources/handlers/resources",
    "tests/sources/handlers/web/resources",
    "tests/resources",
]

[tool.typos.default.extend-words]
# NOTE: in docs
formater = "formater"
rela = "rela"
# NOTE: these appear in some queries, urls, identifiers, and venue names
ACI = "ACI"
ein = "ein"
selv = "selv"
Rin = "Rin"
shs = "shs"
Comput = "Comput"
TOU = "TOU"
